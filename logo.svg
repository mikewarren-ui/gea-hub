<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" role="img" aria-label="GE Appliances a Haier company">
  <!-- GE monogram circle -->
  <circle cx="50" cy="50" r="44" fill="#1B4F8A"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="white" stroke-width="1" stroke-dasharray="3 2" opacity=".4"/>
  <!-- Stylized "ge" script letterform -->
  <text x="50" y="62" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700" font-style="italic"
        fill="white" letter-spacing="-2">ge</text>
  <!-- GE APPLIANCES wordmark -->
  <text x="106" y="38"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="18" font-weight="800" fill="#1B4F8A"
        letter-spacing="2" text-anchor="start">GE APPLIANCES</text>
  <!-- a Haier company -->
  <text x="108" y="58"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-weight="400" font-style="italic"
        fill="#1B4F8A" letter-spacing=".5" text-anchor="start">a <tspan font-weight="700" font-style="normal">Haier</tspan> company</text>
</svg>
